<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header class="ion-no-border">
        <ion-toolbar class="menu-toolbar">
          <div class="logo">
            <span class="logo-mark"><span></span></span>
            <span>Movi<b>RD</b></span>
          </div>
          <ion-buttons slot="end">
            <ion-menu-toggle>
              <ion-button class="menu-close" aria-label="Cerrar menú">
                <ion-icon slot="icon-only" name="close-outline"></ion-icon>
              </ion-button>
            </ion-menu-toggle>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <p class="menu-kicker">Explora</p>
        <ion-list lines="none">
          @for (p of appPages; track p.url) {
            <ion-menu-toggle [autoHide]="false">
              <ion-item
                button
                detail="false"
                routerDirection="root"
                [routerLink]="[p.url]"
                routerLinkActive="selected"
              >
                <div class="menu-icon" slot="start">
                  <ion-icon aria-hidden="true" [name]="p.icon + '-outline'"></ion-icon>
                </div>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
