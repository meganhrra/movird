<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button class="round-btn" menuIcon="menu-outline" aria-label="Abrir menú"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="end">
      <div class="avatar">AM</div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <p class="ciudad">SANTIAGO DE LOS CABALLEROS</p>
  <h1 class="saludo">¡Hola! ¿A dónde te diriges?</h1>

  <ion-searchbar placeholder="Buscar lugar o zona" class="buscador"></ion-searchbar>

  <div class="categorias">
    @for (c of categorias; track c.texto) {
      <div class="categoria">
        <div class="cat-icon"><ion-icon [name]="c.icono"></ion-icon></div>
        <ion-label>{{ c.texto }}</ion-label>
      </div>
    }
  </div>

  <div class="seccion-header">
    <h2>Explora la zona</h2>
    <a routerLink="/mapa">Ver mapa completo</a>
  </div>

  <!-- Simulador de mapa con pines -->
  <div class="mini-mapa">
    <span class="calle">Av. Las Carreras</span>
    <span class="zona">Centro</span>
    <ion-icon name="location-sharp" class="pin" style="top: 30px; left: 60px"></ion-icon>
    <ion-icon name="location-sharp" class="pin" style="top: 22px; left: 200px"></ion-icon>
    <ion-icon name="location-sharp" class="pin" style="top: 70px; left: 140px"></ion-icon>
    <ion-icon name="location-sharp" class="pin" style="top: 85px; left: 230px"></ion-icon>
  </div>

  <div class="seccion-header">
    <h2>Opciones para ti</h2>
    <a>Ver todas</a>
  </div>

  @for (p of opciones; track p.id) {
    <app-parking-card [parqueo]="p"></app-parking-card>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button class="fab-ubicacion">
      <ion-icon name="locate-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
