<ion-header class="movird-header ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
    <div class="avatar" slot="end">AM</div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-centrado">
  <ion-refresher slot="fixed" (ionRefresh)="actualizarOpciones($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle"
      pullingText="Desliza para actualizar"
      refreshingSpinner="crescent"
      refreshingText="Actualizando..."
    ></ion-refresher-content>
  </ion-refresher>

  <p class="ciudad">SANTIAGO DE LOS CABALLEROS</p>
  <h1 class="saludo">¡Hola! ¿A dónde te diriges?</h1>

  <ion-searchbar
    placeholder="Buscar parqueo o zona"
    class="buscador"
    [value]="busqueda()"
    (ionInput)="busqueda.set($event.detail.value ?? '')"
  ></ion-searchbar>

  <div class="categorias">
    @for (c of categorias; track c.id) {
      <button
        type="button"
        class="categoria"
        routerLink="/resultados"
        [queryParams]="{ filtro: c.id }"
      >
        <span class="icono-categoria"><ion-icon [name]="c.icono"></ion-icon></span>
        {{ c.texto }}
      </button>
    }
  </div>

  <div class="seccion-header">
    <h2>Explora la zona</h2>
    <a routerLink="/mapa">Ver mapa completo</a>
  </div>

  <img
    class="mini-mapa"
    src="assets/img/mapa-santiago-mini.png"
    alt="Mapa del centro de Santiago"
  />

  <div class="seccion-header">
    <h2>Opciones para ti</h2>
    <a routerLink="/resultados">Ver todas</a>
  </div>

  <ion-list lines="none" class="lista">
    @for (p of opciones(); track p.id) {
      <ion-item class="item-tarjeta">
        <app-tarjeta-parqueo [parqueo]="p"></app-tarjeta-parqueo>
      </ion-item>
    } @empty {
      <p class="vacio">No hay parqueos que coincidan.</p>
    }
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button class="fab-ubicacion" routerLink="/mapa" aria-label="Cerca de mí">
      <ion-icon name="locate-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
