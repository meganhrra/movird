<ion-header class="movird-header ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Favoritos</ion-title>
    <div class="header-spacer" slot="end"></div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-centrado">
  <ion-refresher slot="fixed" (ionRefresh)="actualizarFavoritos($event)">
    <ion-refresher-content
      pullingIcon="chevron-down-circle"
      pullingText="Desliza para actualizar"
      refreshingSpinner="crescent"
      refreshingText="Actualizando..."
    ></ion-refresher-content>
  </ion-refresher>

  <h1 class="titulo">Mis favoritos</h1>
  <p class="ayuda">Desliza un parqueo a la izquierda para quitarlo.</p>

  @if (favoritos().length > 0) {
    <ion-list lines="none" class="lista">
      @for (p of favoritos(); track p.id) {
        <ion-item-sliding (ionSwipe)="quitarFavorito(p)">
          <ion-item class="item-tarjeta">
            <app-tarjeta-parqueo [parqueo]="p" (favoritoChange)="alCambiarFavorito($event)">
            </app-tarjeta-parqueo>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="danger" expandable="true" (click)="quitarFavorito(p)">
              <ion-icon slot="start" name="trash-outline"></ion-icon>
              Eliminar
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  } @else {
    <p class="vacio">
      No tienes parqueos guardados. Toca el corazón de una tarjeta en Inicio para guardarla.
    </p>
  }
</ion-content>
