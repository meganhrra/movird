<ion-header class="movird-header ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Favoritos</ion-title>
    <div class="header-spacer" slot="end"></div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-content [fullscreen]="true" class="ion-padding">
    <ion-refresher slot="fixed" (ionRefresh)="actualizarFavoritos($event)">
      <ion-refresher-content
        pullingText="Desliza para actualizar"
        refreshingText="Actualizando..."
      ></ion-refresher-content>
    </ion-refresher>
    <h1 class="titulo">Mis favoritos</h1>

    <ion-list lines="none" class="lista">
      @for (p of favoritos; track p.id) {
        <ion-item-sliding>
          <ion-item lines="none" class="favorito-item">
            <app-parking-card [parqueo]="p"></app-parking-card>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="quitarFavorito(p)">
              <ion-icon slot="start" name="trash-outline"></ion-icon>
              Eliminar
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  </ion-content>
</ion-content>
