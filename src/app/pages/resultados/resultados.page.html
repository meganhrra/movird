<ion-header class="movird-header ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text="" aria-label="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ titulo() }}</ion-title>
    <div class="header-spacer" slot="end"></div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-centrado">
  <div class="filtros">
    @for (c of chips; track c.id) {
      <ion-chip [class.activo]="filtro() === c.id" (click)="elegirFiltro(c.id)">
        {{ c.texto }}
      </ion-chip>
    }
  </div>

  <p class="resumen">
    {{ resultados().length }} {{ resultados().length === 1 ? 'parqueo' : 'parqueos' }} · del más
    cercano al más lejano
  </p>

  <ion-list lines="none" class="lista">
    @for (p of resultados(); track p.id) {
      <ion-item class="item-tarjeta">
        <app-tarjeta-parqueo [parqueo]="p"></app-tarjeta-parqueo>
      </ion-item>
    } @empty {
      <p class="vacio">No hay parqueos con este filtro.</p>
    }
  </ion-list>
</ion-content>
