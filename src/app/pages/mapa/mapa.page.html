<ion-content [fullscreen]="true" scroll-y="false">
  <div class="mapa">
    <span class="calle">Av. Las Carreras</span>
    <ion-icon name="location-sharp" class="pin" style="top: 30%; left: 18%"></ion-icon>
    <ion-icon name="location-sharp" class="pin" style="top: 26%; left: 62%"></ion-icon>
    <ion-icon name="location-sharp" class="pin" style="top: 70%; left: 68%"></ion-icon>
    <div class="precio-pin" style="top: 56%; left: 42%">RD$75</div>
  </div>

  <div class="barra-superior">
    <ion-menu-button class="menu-flotante"></ion-menu-button>
    <span class="titulo-chip">Mapa</span>
  </div>

  <div class="buscador-fila">
    <ion-searchbar placeholder="Buscar lugar o zona" class="buscador"></ion-searchbar>
    <ion-button class="filtro-btn" aria-label="Filtrar parqueos">
      <ion-icon slot="icon-only" name="options-outline"></ion-icon>
    </ion-button>
  </div>

  <ion-fab vertical="center" horizontal="end" class="fab-ruta">
    <ion-fab-button size="small" color="light" aria-label="Centrar mapa">
      <ion-icon name="navigate-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <div class="tarjeta-inferior">
    <app-parking-card [parqueo]="seleccionado"></app-parking-card>
  </div>
</ion-content>
